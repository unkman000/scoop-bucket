name: Excavator

on:
  workflow_dispatch:
  schedule:
    # every 6 hours
    - cron: '20 */6 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Excavate
        uses: ScoopInstaller/GithubActions@v3.0.0
        env:
          SKIP_UPDATED: 1
